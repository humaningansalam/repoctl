[project]
name = "repoctl"
version = "1.0.0"
description = "Markdown tasks and project source navigation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# AST navigation is a plug-in enhancement; core Task/Knowledge/Graph reads
# continue without a compiled language parser installed.
structural = ["tree-sitter-language-pack>=0.12,<1"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=9.0.3"
]
