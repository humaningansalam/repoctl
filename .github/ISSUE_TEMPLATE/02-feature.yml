name: 기능 제안
description: repoctl 사용 중 해결할 문제와 원하는 결과를 제안합니다.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        repoctl은 프로젝트 탐색과 작업 재개·종료를 돕는 도구입니다.
        모델 선택, 에이전트 실행, 제품 배포를 자동으로 소유하지 않습니다.
        특정 구현 방식보다 실제 사용 흐름을 설명해 주세요. 한국어 또는 영어로 작성할 수 있습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      placeholder: |
        어떤 상황에서:
        현재의 불편 또는 반복 비용:
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과와 사용 예시
      placeholder: |
        현재:
        원하는 결과:
        결과를 확인할 수 있는 구체적인 사용 예시:
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 우회 방법과 유지해야 할 조건
      description: 현재 우회 방법, 호환성·기존 자료 보존·불확실성 표시 등 관련 조건만 적어 주세요. 구현 제안은 선택 사항입니다.
