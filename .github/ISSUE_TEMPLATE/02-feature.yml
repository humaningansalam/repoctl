name: Feature request
description: Describe a problem in your work and the result you need.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired result
      description: Give a concrete example of the current workflow and what should improve.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant constraints, alternatives, or implementation ideas.
