name: Bug report
description: A repoctl command behaves differently from what you expected.
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Problem and expected result
      description: Describe what you tried, what happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, relevant minimal input, output, and version when available.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues or environment details that help explain the problem.
